<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff62a6" />
      <stop offset="100%" stop-color="#ff2a85" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Luxury Framing -->
  <circle cx="100" cy="100" r="92" fill="#08080a" stroke="url(#goldGradient)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.85" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ff2a85" stroke-width="1" opacity="0.5" />

  <!-- Monogram T & D Intertwined -->
  <!-- Letter T in Hot Pink -->
  <path d="M60 62 H140 V72 H106 V145 H94 V72 H60 Z" fill="url(#pinkGradient)" filter="url(#subtleGlow)" />
  
  <!-- Letter D in Gold script overlay -->
  <path d="M96 66 H122 C148 66 162 80 162 102 C162 125 146 142 120 142 H96 V132 H118 C138 132 149 119 149 102 C149 86 139 76 120 76 H96 Z" fill="url(#goldGradient)" opacity="0.95" />

  <!-- Small Atelier Diamond -->
  <polygon points="100,40 105,48 100,56 95,48" fill="#fbbf24" />
  <polygon points="100,148 104,154 100,160 96,154" fill="#ff2a85" />
</svg>
